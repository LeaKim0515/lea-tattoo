<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<!--
  /bio 인터스티셜 (설계서 v3 D-1, 2026-08-28) — IG 프로필 바이오 링크 전용.
  목적: 현행 「/bio → Railway /r 302」 사이에 leakim.art 도메인의 정적 1페이지를 끼워
        Meta Pixel PageView를 발사하고(_fbp 쿠키 발급) 그 쿠키를 /r에 &fbp=로 넘긴다.

  ★ 절대 원칙 3개 (깨지면 이 페이지는 폐기)
   1) JS 내비게이션은 우리 도메인(Railway /r)까지만. LINE 앱 핸드오프는 지금과 **완전히 같은**
      서버 302(index.js /r 핸들러 res.redirect(302, lineUrl) → line.me/R/oaMessage/...)가 담당한다. LINE으로 가는 홉을 JS로 바꾸면
      iOS 인앱 브라우저의 딥링크 인터셉트 제외 함정에 걸린다.
   2) 목적지 문자열(DEST)은 현행 netlify.toml:16 / _redirects:3 과 **문자 단위 동일**.
      utm·conversion_path·프리필·ZW 토큰 귀속 체인은 서버가 만들며 여기서 손대지 않는다.
   3) 화면 텍스트 0자·배경 1색. <title>도 두지 않는다(인앱 브라우저 헤더에 문구가 뜨지 않게).

  ★ meta refresh 백스톱은 **의도적으로 두지 않는다** (r3 devil 급소3).
     JS가 정상 동작해도 취소되지 않아, iOS IAB가 유니버설 링크 핸드오프 시 문서를 언로드하지 않는
     경우 3초 뒤 /r로 재이동 → pending_utm 중복행 + ViewContent/IGBioVisit CAPI 이중 발사.
     JS 사망 커버는 아래 1200ms 상한 타이머(인라인 = 외부 스크립트 실패와 무관)로 대신한다.
     JS 자체가 꺼진 브라우저만 <noscript> meta refresh가 받는다(이 경우 go()는 애초에 안 돈다 = 이중 히트 없음).
-->
<style>html,body{background:#080808;margin:0;height:100%}</style>
<script>
(function () {
  // 현행 리다이렉트 목적지와 문자 단위 동일 — 이 상수는 손대지 않는다.
  var DEST = 'https://lealinebot-production.up.railway.app/r?source=ig&medium=bio&campaign=ig_bio&content=link_in_bio&conversion_path=ig_bio';

  // ── 테스트 유입 배제 마커 (r3 devil 해소조건 ①) ──
  //   배포 후 실패 재현 테스트(미친추 계정 등)가 실유입과 같은 라벨로 적립되면
  //   ig_bio_inflow_7d 모니터·T-B(K=0)가 그 1건으로 최대 7일 무음화된다.
  //   /bio?e2e=1 로 열면 campaign·conversion_path를 **`e2e_` 접두**로 갈라 적립한다.
  //
  //   ★ 접미(`ig_bio_e2e`)가 아니라 접두(`e2e_ig_bio`)인 이유 — 서버 /r의 CAPI 분기 때문이다.
  //     src/index.js /r의 IGBioVisit 분기 `if (conversionPath && conversionPath.indexOf('ig_') === 0)` 가
  //     **접두 `ig_`만** 보고 IGBioVisit CAPI를 발사한다. 접미형(`ig_bio_e2e`)은 이 조건을
  //     그대로 통과해 **테스트 유입이 IGBioVisit 커스텀 이벤트로 Meta에 실계상**된다.
  //     그 블록(:436-449)은 try/catch 밖·302 앞이라 **바이트 무접촉 락** 대상이라 서버에서
  //     예외를 팔 수 없다 → 배제는 여기(클라이언트 라벨)에서만 가능하다.
  //     `e2e_` 접두면 indexOf('ig_')===0 이 거짓 → **IGBioVisit 미발사**.
  //
  //   ★ 모니터 정합: absence-watch의 3건은 분자 `conversion_path = 'ig_bio'`(정확일치),
  //     분모 `LIKE 'ig\_%' ESCAPE '\'` 다. `e2e_ig_bio`는 **분자·분모 양쪽에서 빠진다**
  //     — 테스트 1건이 최후 그물을 무음화하지도, 없는 위반을 만들지도 않는다.
  //
  //   ★ 남는 것(명시 수용): `/r`은 크롤러가 아닌 모든 히트에 ViewContent(`vc_r_`+token)를
  //     무조건 발사한다(index.js /r의 vc_r_ ViewContent 발사부, 경로 무관). 따라서 **E2E 1회당 ViewContent 1건은 계상된다.**
  //     제거하려면 무접촉 락 구간을 건드려야 하므로 수용한다 — ViewContent는 P59 판정축
  //     (서버 QL 절대수·클릭 연령·친추 절대수) 어디에도 들어가지 않고, E2E는 배포당 1~2회다.
  //
  //   ※ 실운영 링크(파라미터 없음)는 항상 위 DEST 그대로 — 귀속 체인 바이트 무변경.
  if (/(?:^|[?&])e2e=1(?:&|$)/.test(location.search)) {
    DEST = DEST.replace('campaign=ig_bio', 'campaign=e2e_ig_bio')
               .replace('conversion_path=ig_bio', 'conversion_path=e2e_ig_bio');
  }

  // ── 착지 비콘 (홉③ 카운터, 2026-09-04 R-NEW) ──────────────────────────
  //   왜: IG 바이오 탭 → /bio 착지 → /r 도달 사이가 우리 원장에 한 줄도 없었다
  //       (9/3 실측 "바이오 탭 14 vs /r 도달 2"의 사이가 블랙박스 · 계측 허점 감사 B1·A20).
  //       Meta 픽셀 PageView는 경로를 버려(/bio vs /card 분해 불가) + p51 락으로 판정 인용 금지.
  //   엔드포인트: POST https://lealinebot-production.up.railway.app/api/bio-hit
  //       (서버 저장 = bio_hits 테이블, 집계 병기 = GET /api/r-hits 의 bio_hits 절)
  //
  //   ★ 리다이렉트 무영향 계약 (이 페이지의 절대 원칙 3개와 같은 급):
  //     · sendBeacon은 **큐에 넣고 즉시 반환**한다 — 응답을 기다리지 않고, location.replace로
  //       문서가 사라져도 브라우저가 대신 보낸다. go()의 타이밍(onload+200ms / 상한 1200ms)과
  //       DEST 문자열은 이 블록으로 인해 1바이트도 바뀌지 않는다.
  //     · 전부 try/catch. 실패·차단·오프라인·403 어느 경우에도 조용히 넘어간다.
  //     · Content-Type은 **text/plain 고정** — application/json이면 CORS preflight(OPTIONS)가 생기고,
  //       언로드 직전 preflight는 통째로 취소돼 카운터가 조용히 0이 된다. 바꾸지 말 것.
  //   ★ PII 미전송: referrer는 **호스트명만**, UA는 mobile/desktop 2값으로만. 쿠키·fbp·전체 URL 금지.
  //   ★ e2e 라벨 분리: ?e2e=1 검증 유입은 e2e:1로 보내 서버 집계·0감시에서 빠진다(실유입 오염 방지).
  //   ★ 롤백: 이 커밋 revert 1회(bio.html 단일 파일). 서버 엔드포인트는 남아도 무해(요청이 안 올 뿐).
  try {
    var HIT_URL = 'https://lealinebot-production.up.railway.app/api/bio-hit';
    var refHost = '';
    try {
      var rm = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\/([^/?#]+)/.exec(String(document.referrer || ''));
      refHost = rm ? rm[1].split(':')[0] : '';
    } catch (e) { refHost = ''; }
    var payload = JSON.stringify({
      page: 'bio',
      e2e: /(?:^|[?&])e2e=1(?:&|$)/.test(location.search) ? 1 : 0,
      ref: refHost,
      ua_class: /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ? 'mobile' : 'desktop'
    });
    var sent = false;
    if (navigator.sendBeacon) {
      // Blob type = text/plain → 단순 요청(preflight 없음). 반환 false면 큐 적재 실패라 폴백으로 넘어간다.
      sent = navigator.sendBeacon(HIT_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    }
    if (!sent) {
      // 폴백: keepalive fetch — 문서 언로드 후에도 전송이 유지된다. 응답은 읽지 않는다.
      fetch(HIT_URL, {
        method: 'POST', keepalive: true, mode: 'cors', cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: payload
      }).catch(function () {});
    }
  } catch (e) { /* 착지 계측 실패는 이동을 절대 막지 않는다 */ }

  // fbp = Meta Browser ID. 서브도메인 인덱스(fb.0/fb.1/fb.2.*)를 전부 허용한다 —
  //   apex/www 구성에 따라 1이 아닌 값이 나올 수 있고, 여기서 과차단하면 재료가 조용히 0이 된다.
  //   서버(src/lib/fbp.js)와 **같은 정규식**. 값은 브라우저 쿠키 원문만 쓴다(자체생성 금지).
  var FBP_RE = /^fb\.[0-9]\.\d{10,16}\.\d{1,20}$/;
  function readFbp() {
    var m = String(document.cookie || '').match(/(?:^|;\s*)_fbp=([^;]+)/);
    if (!m) return null;
    var v = decodeURIComponent(m[1]);
    return FBP_RE.test(v) ? v : null;
  }

  // 이동은 1회뿐 — 어느 트리거가 먼저 오든 뒤엣것은 전부 무시된다.
  var fired = false;
  function go() {
    if (fired) return;
    fired = true;
    var fbp = null;
    try { fbp = readFbp(); } catch (e) {}
    // ★ 재료보다 이동이 항상 우선: fbp가 없으면 없는 대로 간다.
    var url = fbp ? (DEST + '&fbp=' + encodeURIComponent(fbp)) : DEST;
    location.replace(url); // replace = 뒤로가기 루프 방지
  }

  // 상한 1200ms: fbevents.js가 차단(광고차단기·기업 DNS)되거나 늦으면 픽셀은 포기하고 이동만 지킨다.
  //   인라인 타이머라 외부 스크립트 로드 실패와 무관하게 반드시 돈다.
  setTimeout(go, 1200);

  // Meta Pixel — card/index.html과 같은 데이터셋. PageView만(ViewContent는 서버 /r와 이중계상, 0828 R-2).
  //   표준 스니펫 + onload/onerror 훅: 정상이면 발사 200ms 뒤 출발, 로드 실패면 즉시 출발.
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;t.onload=function(){setTimeout(go,200)};t.onerror=function(){go()};
  s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1003353476194605');
  fbq('track', 'PageView');
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0;url=https://lealinebot-production.up.railway.app/r?source=ig&medium=bio&campaign=ig_bio&content=link_in_bio&conversion_path=ig_bio">
<img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1003353476194605&ev=PageView&noscript=1"/>
</noscript>
</head>
<body></body>
</html>
