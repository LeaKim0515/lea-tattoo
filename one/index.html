:root {

*{margin:0;padding:0;box-sizing:border-box}

    rgba(8,8,8,.25) 75%,

<script>
document.getElementById('line-cta').addEventListener('click', function(e){
  e.preventDefault();

  var adVisit = null;
  try {
    var stored = localStorage.getItem('lea_ad_visit');
    if(stored){ adVisit = JSON.parse(stored); if(Date.now()-adVisit.ts>604800000) adVisit=null; }
  } catch(ex){}

  var isPremium = adVisit && adVisit.utm_campaign && adVisit.utm_campaign.indexOf('premium') !== -1;
  var leadValue = isPremium ? 120000 : 60000;
  var contentName = isPremium ? 'premium_one' : 'one_page_line';

  // Lead (Pixel)
  if(typeof fbq === 'function'){
    fbq('track', 'Lead', {
      content_name: contentName,
      value: leadValue,
      currency: 'JPY'
    });
  }

  // generate_lead (GA4)
  if(typeof gtag === 'function'){
    gtag('event', 'generate_lead', {
      content_name: contentName,
      value: leadValue,
      currency: 'JPY',
      landing_page: 'one',
      send_to: 'G-QZSP3DHNW6',
      transport_type: 'beacon'
    });
  }

  setTimeout(function(){
    window.location.href = 'https://line.me/R/ti/p/@722xsnht';
  }, 300);
});
</script>
