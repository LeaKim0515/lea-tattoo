# 루트=죽은 index.html이 폐가격 노출 — /card/로 강제 리다이렉트 (2026-07-06 프리모템 GO)
[[redirects]]
  from = "/"
  to = "/card/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/card/"
  status = 302
  force = true

# /bio = IG 프로필 바이오 링크 — 인터스티셜 rewrite (설계서 v3 D-1, 2026-08-28)
#   status 200(rewrite) = 주소창 URL 불변(leakim.art/bio 그대로). 302로 바꾸면 URL이 노출된다.
#   Railway /r 로 가는 목적지 문자열은 bio.html 안의 DEST 상수로 이동했다 — 문자 단위 동일.
#   ★ _redirects:3 과 **동시 수정 필수**: 두 파일의 우선순위는 [미검증]이라 어느 쪽이 이겨도
#     같은 결과가 나오게 둘 다 같은 규칙을 둔다.
#   롤백 = 이 커밋 revert 1회(bio.html·netlify.toml·_redirects 3파일 단일 커밋).
[[redirects]]
  from = "/bio"
  to = "/bio.html"
  status = 200
  force = true

[[redirects]]
  from = "/r"
  to = "https://lealinebot-production.up.railway.app/r"
  status = 302
  force = true
